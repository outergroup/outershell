<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Hello World</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <p class="eyebrow">HTML implementation</p>
    <h1>Hello World</h1>
    <p class="intro">This page and the macOS outerframe are separate platform-native implementations backed by the same server.</p>
    <section aria-labelledby="server-heading">
      <h2 id="server-heading">Server</h2>
      <dl>
        <div><dt>Message</dt><dd id="message">Connecting…</dd></div>
        <div><dt>Host</dt><dd id="hostname">—</dd></div>
        <div><dt>Platform</dt><dd id="platform">—</dd></div>
        <div><dt>Time</dt><dd id="time">—</dd></div>
      </dl>
      <button id="refresh" type="button">Refresh</button>
      <p id="error" role="alert"></p>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
